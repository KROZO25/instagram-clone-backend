<!-- templates/profile.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <style>
    body { max-width: 600px; margin: 2rem auto; }
    .clickable { cursor: pointer; text-decoration: underline; color: blue; margin-right:1rem; }
  </style>
</head>
<body>

  <!-- AUTH CONTROLS -->
  <div id="auth-controls" class="d-flex mb-4">
    <input id="email"    class="form-control me-2" placeholder="Email">
    <input id="password" class="form-control me-2" placeholder="Password" type="password">
    <button id="btn-signin"  class="btn btn-primary me-2">Sign In</button>
    <button id="btn-signup"  class="btn btn-secondary me-2">Sign Up</button>
    <button id="btn-signout" class="btn btn-danger d-none">Sign Out</button>
    <a id="btn-profile" class="btn btn-info ms-2 d-none">My Profile</a>
    <a id="btn-feed" class="btn btn-link d-none ms-2">Feed</a>
  </div>

  <h1 id="profile-email">Profile</h1>

  <!-- Follow/unfollow button (only on someone else’s profile) -->
  <button id="btn-follow" class="btn btn-primary d-none mb-3"></button>

  <div>
    <span id="followers-count" class="clickable d-none">0 Followers</span>
    <span id="following-count" class="clickable d-none">0 Following</span>
  </div>

  <hr>

  <h2>User’s Posts</h2>
  <div id="posts-container" class="row gy-3"></div>
  <p id="no-posts" class="d-none">No posts yet.</p>

  <!-- 1) Firebase config -->
  <script src="/static/env.js"></script>
  <!-- 2) initialize Firebase -->
  <script type="module" src="/static/firebase-init.js"></script>
  <!-- 3) auth logic (sign‑in/out & My Profile link) -->
  <script type="module" src="/static/firebase-auth.js"></script>

  <script type="module">
    import { getAuth, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      updateDoc,
      arrayUnion,
      arrayRemove
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const auth = getAuth();
    const db   = getFirestore();

    // whose profile are we viewing?
    const params     = new URLSearchParams(window.location.search);
    const profileUid = params.get("uid");

    // DOM elements
    const eProfileEmail = document.getElementById("profile-email");
    const btnFollow     = document.getElementById("btn-follow");
    const eFollowers    = document.getElementById("followers-count");
    const eFollowing    = document.getElementById("following-count");
    const ePosts        = document.getElementById("posts-container");
    const eNoPosts      = document.getElementById("no-posts");

    let meUid, isFollowing;

    onAuthStateChanged(auth, async user => {
      if (!user) {
        return window.location.href = "/";
      }
      meUid = user.uid;

      // show “My Profile” link
      const btnProfile = document.getElementById("btn-profile");
      btnProfile.href = `/profile?uid=${meUid}`;
      btnProfile.classList.remove("d-none");

      // load the profile user’s document
      const profRef  = doc(db, "User", profileUid);
      const profSnap = await getDoc(profRef);
      if (!profSnap.exists()) {
        eProfileEmail.textContent = "Unknown user";
        return;
      }
      const profData = profSnap.data();
      eProfileEmail.textContent = profData.Username;

      // Followers / Following counts
      const follArr = profData.Followers || [];
      const ingArr  = profData.Following || [];
      eFollowers.textContent = `${follArr.length} Followers`;
      eFollowing.textContent = `${ingArr.length} Following`;
      eFollowers.classList.remove("d-none");
      eFollowing.classList.remove("d-none");
      eFollowers.onclick = () => window.location.href = `/followers?uid=${profileUid}`;
      eFollowing.onclick = () => window.location.href = `/following?uid=${profileUid}`;

      // Follow/unfollow button if this is not your own profile
      if (meUid !== profileUid) {
        isFollowing = follArr.includes(meUid);
        btnFollow.textContent = isFollowing ? "Unfollow" : "Follow";
        btnFollow.classList.remove("d-none");
        btnFollow.onclick = async () => {
          if (isFollowing) {
            await updateDoc(doc(db,"User",meUid),    { Following: arrayRemove(profileUid) });
            await updateDoc(profRef,                  { Followers:  arrayRemove(meUid) });
            isFollowing = false;
            btnFollow.textContent = "Follow";
            eFollowers.textContent = `${follArr.length - 1} Followers`;
          } else {
            await updateDoc(doc(db,"User",meUid),    { Following: arrayUnion(profileUid) });
            await updateDoc(profRef,                  { Followers:  arrayUnion(meUid) });
            isFollowing = true;
            btnFollow.textContent = "Unfollow";
            eFollowers.textContent = `${follArr.length + 1} Followers`;
          }
        };
      }

      // fetch and render this user’s posts
      const resp = await fetch(`/api/posts?uid=${profileUid}`);
      if (!resp.ok) {
        eNoPosts.textContent = "Error loading posts.";
        eNoPosts.classList.remove("d-none");
        return;
      }
      const posts = await resp.json();
      if (posts.length === 0) {
        eNoPosts.classList.remove("d-none");
      } else {
        for (const p of posts) {
          const col = document.createElement("div");
          col.className = "col-12";
          col.innerHTML = `
            <div class="card mb-3">
              <img src="${p.imageUrl}" class="card-img-top" alt="Post image"/>
              <div class="card-body">
                <p class="card-text">${p.caption || ""}</p>
                <small class="text-muted">${new Date(p.date).toLocaleString()}</small>
              </div>
            </div>`;
          ePosts.appendChild(col);
        }
      }
    });
  </script>

</body>
</html>
