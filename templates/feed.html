<!-- templates/feed.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Feed</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <style>
    body { max-width: 600px; margin: 2rem auto; }
    .clickable { cursor: pointer; }
  </style>
</head>
<body>

  <!-- AUTH CONTROLS -->
  <div id="auth-controls" class="d-flex mb-4">
    <input id="email"    class="form-control me-2" placeholder="Email">
    <input id="password" class="form-control me-2" placeholder="Password" type="password">
    <button id="btn-signin"  class="btn btn-primary me-2">Sign In</button>
    <button id="btn-signup"  class="btn btn-secondary me-2">Sign Up</button>
    <button id="btn-signout" class="btn btn-danger d-none">Sign Out</button>
    <a id="btn-profile"     class="btn btn-link d-none ms-2">My Profile</a>
  </div>

  <!-- USER SEARCH BAR -->
  <div class="mb-4">
    <input
      id="user-search"
      type="text"
      class="form-control"
      placeholder="🔍 Search users…"
    />
    <ul id="search-results" class="list-group mt-2"></ul>
  </div>

  <h1>Your Feed</h1>
  <div id="feed-container" class="row gy-3"></div>
  <p id="no-feed" class="d-none">No posts from people you follow yet.</p>

  <!-- 1) Firebase config -->
  <script src="/static/env.js"></script>
  <!-- 2) initialize Firebase -->
  <script type="module" src="/static/firebase-init.js"></script>
  <!-- 3) authentication logic -->
  <script type="module" src="/static/firebase-auth.js"></script>
  <!-- 4) user‐search logic -->
  <script src="/static/search.js"></script>
  <!-- 5) feed + comments logic -->
  <script type="module" src="/static/feed.js"></script>
</body>
</html>
