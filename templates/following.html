<!-- templates/following.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Following</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <style>
    body { max-width:600px; margin:2rem auto; }
  </style>
</head>
<body>

  <!-- AUTH CONTROLS -->
  <div id="auth-controls" class="d-flex mb-4">
    <input id="email"    class="form-control me-2" placeholder="Email">
    <input id="password" class="form-control me-2" placeholder="Password" type="password">
    <button id="btn-signin"  class="btn btn-primary me-2">Sign In</button>
    <button id="btn-signup"  class="btn btn-secondary me-2">Sign Up</button>
    <button id="btn-signout" class="btn btn-danger d-none">Sign Out</button>
    <a id="btn-profile"     class="btn btn-link d-none ms-2">My Profile</a>
  </div>

  <h1>Following</h1>
  <ul id="list" class="list-group"></ul>
  <p id="no-list" class="d-none">Not following anyone yet.</p>

  <!-- 1) load your Firebase config onto window -->
  <script src="/static/env.js"></script>
  <!-- 2) initialize Firebase -->
  <script type="module" src="/static/firebase-init.js"></script>
  <!-- 3) auth logic & “My Profile” wiring -->
  <script type="module" src="/static/firebase-auth.js"></script>

  <script type="module">
    import { getAuth, onAuthStateChanged }
      from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc
    } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const auth = getAuth();
    const db   = getFirestore();

    // whose following list are we showing?
    const params = new URLSearchParams(window.location.search);
    const uid    = params.get("uid");

    const ul   = document.getElementById("list");
    const none = document.getElementById("no-list");

    onAuthStateChanged(auth, async user => {
      if (!user) {
        // not signed in → back to login
        return window.location.href = "/";
      }

      // show “My Profile” link
      const btnProfile = document.getElementById("btn-profile");
      btnProfile.href = `/profile?uid=${user.uid}`;
      btnProfile.classList.remove("d-none");

      // load this profile’s User doc
      const snap = await getDoc(doc(db, "User", uid));
      if (!snap.exists()) {
        none.textContent = "User not found.";
        none.classList.remove("d-none");
        return;
      }

      // read Following array
      const arr = snap.data().Following || [];
      if (arr.length === 0) {
        none.classList.remove("d-none");
        return;
      }

      // display in reverse‐chronological order
      for (const fuid of arr.slice().reverse()) {
        // fetch each followed user’s Username
        const fSnap = await getDoc(doc(db, "User", fuid));
        const name  = fSnap.exists() ? fSnap.data().Username : fuid;

        const li = document.createElement("li");
        li.className = "list-group-item";
        li.innerHTML = `<a href="/profile?uid=${fuid}">${name}</a>`;
        ul.appendChild(li);
      }
    });
  </script>
</body>
</html>
