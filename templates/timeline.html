<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><title>Your Timeline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .timeline { border-left: 2px solid #ccc; margin-left:1rem; padding-left:1rem; }
    .entry   { position: relative; margin-bottom:2rem; }
    .entry::before {
      content: "";
      position: absolute;
      left: -11px; top: 4px;
      width: 8px; height: 8px;
      background: #007bff;
      border-radius: 50%;
    }
  </style>
</head>
<body class="container py-4">
  <div id="auth-controls" class="d-flex mb-4">
    <!-- … your auth UI … -->
  </div>

  <h1>Your Timeline</h1>
  <div id="timeline" class="timeline"></div>
  <p id="no-tl" class="d-none">Nothing in your timeline yet.</p>

  <script src="/static/env.js"></script>
  <script type="module" src="/static/firebase-init.js"></script>
  <script type="module" src="/static/firebase-auth.js"></script>
  <script type="module" src="/static/timeline.js"></script>
</body>
</html>
