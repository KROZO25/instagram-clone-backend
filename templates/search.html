<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search Profiles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style> body { max-width:600px; margin:2rem auto; } </style>
</head>
<body>
  <div id="auth-controls" class="d-flex mb-4">
    <!-- same auth UI… -->
  </div>

  <h1>Search Profiles</h1>
  <input id="search-input" class="form-control mb-3" placeholder="Start typing a name…" />
  <ul id="results" class="list-group"></ul>
  <p id="no-results" class="d-none">No matches.</p>

  <script src="/static/env.js"></script>
  <script type="module" src="/static/firebase-init.js"></script>
  <script type="module" src="/static/firebase-auth.js"></script>
  <script type="module">
    import { getFirestore, collection, query, where, orderBy, startAt, endAt, getDocs } 
      from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const db = getFirestore();
    const input   = document.getElementById("search-input");
    const ul      = document.getElementById("results");
    const none    = document.getElementById("no-results");

    input.addEventListener("input", async () => {
      const text = input.value.trim().toLowerCase();
      ul.innerHTML = "";
      none.classList.add("d-none");
      if (!text) return;

      // Firestore prefix‑match on lowercase Username
      const q = query(
        collection(db,"User"),
        orderBy("Username_lowercase"),
        startAt(text),
        endAt(text + "\uf8ff")
      );
      const snap = await getDocs(q);
      if (snap.empty) {
        none.classList.remove("d-none");
      } else {
        for (const doc of snap.docs) {
          const name = doc.data().Username;
          const li = document.createElement("li");
          li.className = "list-group-item";
          li.innerHTML = `<a href="/profile?uid=${doc.id}">${name}</a>`;
          ul.append(li);
        }
      }
    });
  </script>
</body>
</html>
